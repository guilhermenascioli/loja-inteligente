services:
  - type: web
    name: loja-inteligente
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: gunicorn app.cloud:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile /dev/null
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LOJA_GEMINI_API_KEY
        sync: false
      - key: LOJA_GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LOJA_GEMINI_FREE_TIER_CONFIRMED
        value: sim
      - key: LOJA_AI_DAILY_LIMIT
        value: 30
